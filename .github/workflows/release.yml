name: Release installable skill

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate_skill.py
      - run: python -m unittest discover -s tests -v
      - name: Build installable ZIP and checksum
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/build_release.py --version "$RELEASE_TAG"
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            "dist/project-kickoff-${RELEASE_TAG}.zip" \
            "dist/project-kickoff-${RELEASE_TAG}.zip.sha256" \
            --verify-tag --title "project-kickoff ${RELEASE_TAG}" --generate-notes
